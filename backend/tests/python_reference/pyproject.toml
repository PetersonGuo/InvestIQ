[project]
name = "stockassist"
version = "0.2.0"
description = "Stock analysis, price alerts, and paper trading"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "requests>=2.32,<3", "python-dotenv>=1,<2", "ib_async>=2.1,<3", "readerwriterlock>1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["api*", "core*", "services*", "utils*", "simulation*"]

[tool.setuptools]
py-modules = ["main"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.package-data]
simulation = ["*.cpp", "*.h", "examples/*.cpp", "examples/*.py"]
